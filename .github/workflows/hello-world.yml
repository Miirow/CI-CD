name: CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: application
          path: dist/

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: application
          path: dist/
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: application
          path: dist/
      - run: echo "API_URL = ${{ vars.API_URL }}"
      - run: |
          echo "## Déploiement" >> $GITHUB_STEP_SUMMARY
          echo "- Cible : ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- URL : ${{ vars.API_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit : $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY
